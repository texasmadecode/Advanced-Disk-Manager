name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'  # Specify a more exact version if needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script (health check on disk C)
        run: |
          python advanced_disk_manager.py --action healthcheck --disk C:

      - name: Run Python script (format disk E)
        run: |
          python advanced_disk_manager.py --action format --disk E: --fs NTFS --label MyDrive

